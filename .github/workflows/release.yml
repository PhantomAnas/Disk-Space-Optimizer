name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -v --timeout=120
      - run: pyinstaller diskoptimizer.spec
      - name: Smoke-run the exe (CLI scan of the checkout)
        shell: pwsh
        run: |
          # A windowed exe detaches from the console, so wait on the process explicitly.
          $p = Start-Process -FilePath (Resolve-Path dist\DiskSpaceOptimizer.exe) -ArgumentList '--cli src --top 5' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe smoke test failed with exit code $($p.ExitCode)" }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/DiskSpaceOptimizer.exe
          generate_release_notes: true
